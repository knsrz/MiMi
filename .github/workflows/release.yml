name: Release MiMi
on:
  push:
    tags: ['v[0-9]*.[0-9]*.[0-9]*']
permissions:
  contents: write
concurrency:
  group: mimi-stable-release
  cancel-in-progress: false
jobs:
  release:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Validate stable tag and signing configuration
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          test -n "$SPARKLE_PRIVATE_KEY" || { echo 'Set the SPARKLE_PRIVATE_KEY repository secret first.'; exit 1; }
          version=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' Resources/Info.plist)
          test "$GITHUB_REF_NAME" = "v$version"
      - name: Test library, editor and exports
        run: ./scripts/test.sh
      - name: Build universal app, installers and signed update feed
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: ./scripts/package-release.sh
      - name: Publish all assets together
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' Resources/Info.plist)
          # Keep an incomplete upload hidden; publish only after every asset is present.
          gh release create "$GITHUB_REF_NAME" --verify-tag --draft --title "MiMi $version" --generate-notes
          gh release upload "$GITHUB_REF_NAME" dist/release-"$version"/*
          gh release edit "$GITHUB_REF_NAME" --draft=false --latest
